plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kerry.zzt'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.kerry.zzt'
        def smokeSuffix = project.findProperty('smokeApplicationIdSuffix')
        if (smokeSuffix != null) {
            applicationIdSuffix smokeSuffix.toString()
        }
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'com.kerry.zzt.TouchControlsInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17' }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
